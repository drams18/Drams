<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Construisez votre projet</title>
  <meta name="description" content="Construisez votre demande de projet pas à pas, dans l'univers du portfolio d'Arphan DRAME.">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Page « Construisez votre projet » — extension du jeu ── */
    .hidden { display: none !important; }

    #bpCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Bouton « étape précédente » — même look que le bouton Accueil du jeu */
    .bp-back-btn { z-index: 40; }
    .bp-back-btn::before { transform: rotate(180deg); }

    /* HUD haut de l'écran — panneau comics */
    .bp-hud {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: min(92vw, 540px);
      text-align: center;
      background: var(--panel, #182449);
      border: 3px solid var(--stroke, #01010a);
      box-shadow: 5px 5px 0 var(--stroke, #01010a), 0 0 22px rgba(25,232,255,0.25);
      padding: 8px 14px 10px;
      pointer-events: none;
    }
    /* Barre de progression (remplace le compteur texte, plus lisible d'un coup d'œil) */
    .bp-progress {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .bp-progress__label {
      font-family: var(--pixel-font);
      font-size: 7px;
      letter-spacing: 1px;
      color: var(--mc-gold);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.7);
      white-space: nowrap;
    }
    .bp-progress__track {
      position: relative;
      width: min(56vw, 240px);
      height: 6px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.18);
      overflow: hidden;
    }
    .bp-progress__fill {
      position: absolute;
      inset: 0 80% 0 0;
      background: var(--mc-gold);
      transition: right 0.45s cubic-bezier(.22,.61,.36,1);
    }
    .bp-hud__title {
      font-family: var(--pixel-font);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 1px;
      color: #fff;
      margin: 8px 0 4px;
      text-shadow: -0.03em 0 0 var(--red, #ff123d), 0.03em 0 0 var(--cyan, #19e8ff), 2px 2px 0 rgba(0,0,0,0.6);
    }
    .bp-hud__help {
      font-family: var(--body-font);
      font-size: 12.5px;
      line-height: 1.5;
      color: #cdd8e6;
    }

    /* Bouton « valider l'étape » — apparaît dès qu'un choix existe.
       Sert d'équivalent tactile à la touche Entrée. */
    .bp-hud__next {
      pointer-events: auto;
      display: inline-block;
      margin: 11px auto 2px;
      font-family: var(--pixel-font);
      font-size: 8px;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, var(--red, #ff123d), var(--magenta, #ff2bb0));
      border: 3px solid var(--stroke, #01010a);
      box-shadow: 4px 4px 0 var(--red-deep, #8f0a24);
      padding: 9px 14px;
      cursor: pointer;
      transition: transform .12s ease, filter .15s;
      animation: bpNextIn .22s ease, bpSense 2.4s ease-in-out .22s infinite;
    }
    .bp-hud__next:hover { filter: brightness(1.1) saturate(1.1); }
    .bp-hud__next:active { transform: translateY(2px); box-shadow: 1px 1px 0 var(--red-deep, #8f0a24); }
    @keyframes bpNextIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Rejoué à chaque changement d'étape pour une transition douce du HUD */
    .bp-hud--change { animation: bpHudSwap .32s cubic-bezier(.22,.61,.36,1); }
    @keyframes bpHudSwap {
      from { opacity: .3; transform: translateX(-50%) translateY(-6px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .bp-quit {
      pointer-events: auto;
      margin-top: 9px;
      font-family: var(--body-font);
      font-size: 11.5px;
      color: #9fb2c6;
      background: transparent;
      border: none;
      border-bottom: 1px dotted #9fb2c6;
      padding: 2px 0;
      cursor: pointer;
    }
    .bp-quit:hover { color: #fff; border-bottom-color: #fff; }

    @media (max-width: 720px) {
      .bp-hud { top: 54px; width: 94vw; padding: 7px 10px 9px; }
      .bp-hud__title { font-size: 9.5px; }
      .bp-hud__help { font-size: 11.5px; }
      .bp-hud__next-hint { display: none; }
      .bp-hud__next { margin-top: 9px; padding: 10px 16px; }
    }
    @media (max-width: 380px) {
      .bp-hud__help { display: none; }
    }

    /* Le toast ne doit pas passer sous la barre de boutons mobile */
    @media (max-width: 720px) {
      #bp-toast { bottom: 92px; }
    }

    /* Voile de transition entre les étapes — flash chromatique */
    #bp-fade {
      position: fixed;
      inset: 0;
      z-index: 200;
      background:
        repeating-linear-gradient(58deg, transparent 0 22px, rgba(255,255,255,0.06) 22px 23px, transparent 23px 46px),
        repeating-linear-gradient(-58deg, transparent 0 22px, rgba(255,255,255,0.06) 22px 23px, transparent 23px 46px),
        radial-gradient(60% 60% at 50% 50%, rgba(25,232,255,0.3) 0%, transparent 70%),
        linear-gradient(115deg, #ff123d 0%, #ff2bb0 32%, #0e1630 33%, #0e1630 66%, #8a3bff 67%, #19e8ff 100%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s cubic-bezier(.4,0,.2,1);
    }
    #bp-fade.bp-fade--on { opacity: 1; }

    /* Panneaux plein écran (récap / formulaire / confirmation) */
    .bp-panel {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 24px 16px 90px;
      background:
        radial-gradient(80% 80% at 50% 40%, transparent 20%, rgba(0,0,0,0.55) 100%),
        var(--halftone, radial-gradient(rgba(255,255,255,0.1) 0.8px, transparent 1.4px)),
        rgba(9,13,28,0.86);
      background-size: auto, var(--halftone-size, 6px 6px), auto;
      animation: bpPanelIn 0.22s ease;
    }
    @keyframes bpPanelIn { from { opacity: 0; } to { opacity: 1; } }

    .bp-panel__card {
      position: relative;
      width: 100%;
      max-width: 460px;
      margin: auto;
      background: var(--panel, #182449);
      border: 3px solid var(--stroke, #01010a);
      box-shadow: 10px 10px 0 var(--red-deep, #8f0a24), 0 0 40px rgba(0,0,0,0.6), 0 0 26px rgba(255,43,176,0.25);
      padding: 20px 20px 22px;
      animation: bpCardIn 0.3s cubic-bezier(.22,.61,.36,1);
    }
    /* Coins de toile décoratifs (SVG original hérité de style.css) */
    .bp-panel__card::before, .bp-panel__card::after {
      content: '';
      position: absolute;
      width: 80px; height: 80px;
      background: var(--web-corner) no-repeat;
      background-size: 100% 100%;
      opacity: 0.07;
      pointer-events: none;
    }
    .bp-panel__card::before { top: 0; left: 0; }
    .bp-panel__card::after  { bottom: 0; right: 0; transform: rotate(180deg); }
    @keyframes bpCardIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bpSense {
      0%, 100% { box-shadow: 4px 4px 0 var(--red-deep, #8f0a24),
                   0 0 0 3px rgba(25,232,255,0.30), 0 0 0 3px rgba(255,43,176,0.28); }
      50%      { box-shadow: 4px 4px 0 var(--red-deep, #8f0a24),
                   0 0 0 13px rgba(25,232,255,0), 0 0 0 22px rgba(255,43,176,0); }
    }
    .bp-panel__card--center { text-align: center; }

    .bp-panel__title {
      font-family: var(--pixel-font);
      font-size: 13px;
      letter-spacing: 1.5px;
      color: var(--magenta, #ff2bb0);
      text-shadow: -0.03em 0 0 var(--red, #ff123d), 0.03em 0 0 var(--cyan, #19e8ff), 0 0 12px rgba(255,43,176,0.5);
      margin-bottom: 14px;
    }
    .bp-panel__intro {
      font-family: var(--body-font);
      font-size: 12.5px;
      line-height: 1.55;
      color: #9aa7bb;
      margin-bottom: 14px;
    }

    /* Récapitulatif */
    .bp-recap-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
    .bp-recap-row {
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.09);
    }
    .bp-recap-row dt {
      font-family: var(--pixel-font);
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--mc-gold);
      margin-bottom: 6px;
    }
    .bp-recap-row dd {
      font-family: var(--body-font);
      font-size: 14px;
      color: #fff;
      line-height: 1.5;
    }

    /* En-tête d'une ligne de récap : libellé + bouton « Modifier cette étape » */
    .bp-recap-row__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }
    .bp-recap-row__head dt { margin-bottom: 0; }
    .bp-recap-edit-btn {
      flex: none;
      font-family: var(--body-font);
      font-size: 10.5px;
      letter-spacing: 0.3px;
      color: var(--cyan, #19e8ff);
      background: transparent;
      border: 2px solid var(--cyan, #19e8ff);
      padding: 4px 9px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .bp-recap-edit-btn:hover,
    .bp-recap-edit-btn.is-active {
      background: rgba(25,232,255,0.16);
      border-color: var(--cyan, #19e8ff);
      color: #fff;
    }

    /* Liste des choix possibles, dépliée sous la ligne */
    .bp-recap-choices {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 11px;
    }
    .bp-choice-chip {
      font-family: var(--body-font);
      font-size: 12px;
      color: #cdd8e6;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.22);
      padding: 7px 10px;
      cursor: pointer;
      transition: background 0.14s, border-color 0.14s, color 0.14s;
    }
    .bp-choice-chip:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.5);
      color: #fff;
    }
    .bp-choice-chip.is-on {
      background: var(--magenta, #ff2bb0);
      border-color: var(--magenta, #ff2bb0);
      color: #fff;
    }
    .bp-choice-done {
      flex: 1 1 100%;
      min-width: 0;
      margin-top: 4px;
    }

    /* Formulaire */
    .bp-field { display: block; margin-bottom: 13px; }
    .bp-field__label {
      display: block;
      font-family: var(--body-font);
      font-size: 12px;
      font-weight: 600;
      color: #cdd8e6;
      margin-bottom: 6px;
    }
    .bp-input {
      width: 100%;
      font-family: var(--body-font);
      font-size: 15px;
      color: #fff;
      background: var(--ink-2, #132048);
      border: 2px solid var(--edge, #2a2f45);
      border-left: 3px solid var(--cyan, #19e8ff);
      padding: 11px 12px;
      outline: none;
    }
    .bp-input:focus { border-color: var(--cyan, #19e8ff); background: rgba(25,232,255,0.05); }
    .bp-textarea { resize: vertical; min-height: 84px; }

    .bp-panel__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .bp-btn {
      flex: 1 1 auto;
      min-width: 140px;
      font-family: var(--pixel-font);
      font-size: 9px;
      letter-spacing: 1px;
      text-align: center;
      text-decoration: none;
      padding: 13px 14px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s, border-color 0.15s;
    }
    .bp-btn:active { transform: translateY(2px); }
    .bp-btn:disabled,
    .bp-btn[aria-disabled="true"] {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      filter: grayscale(0.35);
    }
    .bp-btn--primary:disabled:hover { filter: none; }
    .bp-btn--primary {
      background: linear-gradient(135deg, var(--red, #ff123d), var(--magenta, #ff2bb0));
      color: #fff;
      border-color: var(--stroke, #01010a);
      box-shadow: 4px 4px 0 var(--red-deep, #8f0a24);
      animation: bpSense 2.6s ease-in-out infinite;
    }
    .bp-btn--primary:disabled,
    .bp-btn--primary[aria-disabled="true"] { animation: none; }
    .bp-btn--primary:hover { filter: brightness(1.1) saturate(1.1); }
    .bp-btn--ghost {
      background: rgba(25,232,255,0.05);
      border-color: var(--cyan, #19e8ff);
      color: #eaf7fb;
    }
    .bp-btn--ghost:hover { background: rgba(25,232,255,0.12); border-color: var(--cyan, #19e8ff); }

    .bp-form-status {
      font-family: var(--body-font);
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
      margin-top: 12px;
      color: #9aa7bb;
    }
    .bp-form-status--error { color: #ff8a80; }

    .bp-panel__exit {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-family: var(--body-font);
      font-size: 11.5px;
      color: #9aa7bb;
    }
    .bp-panel__exit:hover { color: #fff; }

    .bp-done-text {
      font-family: var(--body-font);
      font-size: 14.5px;
      line-height: 1.7;
      color: #dfe7f0;
      margin-bottom: 20px;
    }
    .bp-panel__card--center .bp-btn { flex: 0 1 auto; min-width: 200px; }

    @media (max-width: 480px) {
      .bp-panel { padding: 18px 12px 96px; }
      .bp-panel__card { padding: 18px 16px 20px; }
      .bp-btn { min-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bp-hud--change, .bp-hud__next, .bp-btn--primary,
      .bp-panel, .bp-panel__card { animation: none !important; }
      .bp-progress__fill, #bp-fade { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <button id="btn-sound" type="button" class="sound-toggle" aria-pressed="true"
          aria-label="Activer ou couper tous les sons">
    <span class="sound-toggle__label">SOUND ON</span>
  </button>

  <canvas id="bpCanvas"></canvas>

  <button id="bp-back" type="button" class="game-home-btn bp-back-btn">Etape precedente</button>

  <div id="bp-hud" class="bp-hud">
    <div class="bp-progress">
      <span class="bp-progress__label" id="bp-counter">1 / 5</span>
      <span class="bp-progress__track"><span class="bp-progress__fill" id="bp-progress-fill"></span></span>
    </div>
    <h1 class="bp-hud__title" id="bp-title">QUE VOULEZ-VOUS CREER ?</h1>
    <p class="bp-hud__help" id="bp-help"></p>
    <button type="button" id="bp-next" class="bp-hud__next hidden">Valider l'etape<span class="bp-hud__next-hint"> &middot; Entree</span> &#9654;</button>
  </div>

  <div id="bp-toast" class="toast hidden"></div>

  <!-- RECAPITULATIF -->
  <section id="bp-recap" class="bp-panel hidden" aria-label="Recapitulatif de votre projet">
    <div class="bp-panel__card">
      <h2 class="bp-panel__title">VOTRE PROJET</h2>
      <dl class="bp-recap-list" id="bp-recap-list"></dl>
      <div class="bp-panel__actions">
        <button type="button" class="bp-btn bp-btn--ghost" id="bp-recap-edit">Tout recommencer</button>
        <button type="button" class="bp-btn bp-btn--primary" id="bp-recap-next">Continuer</button>
      </div>
      <p class="bp-form-status" id="bp-recap-status" role="status" aria-live="polite"></p>
      <a class="bp-panel__exit" href="index.html">Revenir au portfolio</a>
    </div>
  </section>

  <!-- FORMULAIRE -->
  <section id="bp-form" class="bp-panel hidden" aria-label="Formulaire de contact">
    <div class="bp-panel__card">
      <h2 class="bp-panel__title">PARLONS DE VOTRE PROJET</h2>
      <p class="bp-panel__intro">Les champs marqués d'un astérisque (*) sont obligatoires.</p>
      <form id="bp-form-el" novalidate>
        <label class="bp-field">
          <span class="bp-field__label">Prénom *</span>
          <input class="bp-input" name="client_prenom" type="text" autocomplete="given-name" required>
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Nom *</span>
          <input class="bp-input" name="client_nom" type="text" autocomplete="family-name" required>
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Adresse e-mail *</span>
          <input class="bp-input" name="client_email" type="email" autocomplete="email" required>
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Téléphone (facultatif)</span>
          <input class="bp-input" name="client_tel" type="tel" autocomplete="tel">
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Message / précisions supplémentaires</span>
          <textarea class="bp-input bp-textarea" name="client_message" id="bp-msg" rows="4"></textarea>
        </label>

        <input type="hidden" name="from_name">
        <input type="hidden" name="from_email">
        <input type="hidden" name="message">

        <div class="bp-panel__actions">
          <button type="button" class="bp-btn bp-btn--ghost" id="bp-form-back">Retour</button>
          <button type="submit" class="bp-btn bp-btn--primary" id="bp-form-submit">Envoyer ma demande</button>
        </div>
        <p class="bp-form-status" id="bp-form-status" role="status" aria-live="polite"></p>
      </form>
      <a class="bp-panel__exit" href="index.html">Revenir au portfolio</a>
    </div>
  </section>

  <!-- CONFIRMATION -->
  <section id="bp-done" class="bp-panel hidden" aria-label="Demande envoyee">
    <div class="bp-panel__card bp-panel__card--center">
      <h2 class="bp-panel__title">PROJET TRANSMIS</h2>
      <p class="bp-done-text">Merci pour votre demande.<br>Je reviendrai vers vous rapidement.</p>
      <a class="bp-btn bp-btn--primary" href="index.html">Retour au portfolio</a>
    </div>
  </section>

  <script>
    if (/Mobi|Android/i.test(navigator.userAgent)) {
      document.querySelectorAll('.desktop-only').forEach(el => el.style.display = 'none');
    }
  </script>

  <!-- EmailJS — MÊME configuration que le formulaire de contact du portfolio -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>emailjs.init('a8mKuHS56bPD-ydT0');</script>

  <script src="js/audio.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/mobileControls.js"></script>
  <script src="js/player.js"></script>
  <script src="js/build-project.js"></script>
</body>
</html>
