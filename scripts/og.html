<!DOCTYPE html>
<!-- Source de l'image de partage (assets/img/og.jpg, 1200×630).
     Régénérée par : npm run build && npm run capture -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; color: #f4f8fb; -webkit-font-smoothing: antialiased;
      font-family: 'Inter Variable', -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #070c14;
    }
    body::after {
      content: ''; position: absolute; top: -300px; right: -220px; width: 860px; height: 860px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255,143,37,.24), transparent);
    }
    .card { position: absolute; z-index: 1; left: 80px; top: 72px; width: 690px; }
    .pill { display: inline-flex; align-items: center; gap: 14px; margin: 0; padding: 10px 22px 10px 18px; font-size: 23px; font-weight: 600; color: #c8cfdc;
      border: 1.5px solid #2a3d58; border-radius: 999px; background: rgba(14,23,36,.7); }
    .pill i { width: 12px; height: 12px; border-radius: 50%; background: #ff9a3c; }
    h1 { margin: 34px 0 0; font-size: 70px; font-weight: 850; letter-spacing: -.045em; line-height: 1.04; }
    h1 em { font-style: normal; color: #ff9a3c; }
    .for { margin: 24px 0 0; font-size: 26px; line-height: 1.4; color: #c8cfdc; }
    .cta { display: flex; align-items: center; gap: 22px; margin-top: 34px; }
    .btn { padding: 14px 28px; font-size: 24px; font-weight: 750; color: #070c14; background: #ff9a3c; border-radius: 999px; }
    .name { font-size: 24px; font-weight: 600; color: #f4f8fb; }
    .name span { display: block; font-size: 20px; font-weight: 500; color: #8f9db0; }
    .vis { position: absolute; z-index: 1; right: 56px; top: 150px; width: 330px; }
    .browser { width: 330px; border: 1.5px solid #2a3d58; border-radius: 14px; overflow: hidden; background: #142238; box-shadow: 0 30px 60px -24px rgba(0,0,0,.7); }
    .bar { display: flex; gap: 7px; height: 26px; align-items: center; padding: 0 12px; background: #0e1724; border-bottom: 1px solid #1c2a3e; }
    .bar i { width: 9px; height: 9px; border-radius: 50%; background: #2a3d58; }
    .browser img { display: block; width: 100%; }
    .phone { position: absolute; right: -24px; top: 84px; width: 138px; border: 6px solid #1a2230; border-radius: 26px; overflow: hidden; background: #1a2230; box-shadow: 0 0 0 1.5px #2a3d58, 0 30px 60px -20px rgba(0,0,0,.8); }
    .phone img { display: block; width: 100%; border-radius: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <p class="pill"><i></i>Développeur web freelance · Île-de-France</p>
    <h1>Des sites et des outils qui vous amènent <em>des clients</em></h1>
    <p class="for">Commerces, artisans, indépendants : être trouvé sur Google, réserver en ligne, gagner du temps.</p>
    <div class="cta"><span class="btn">Devis gratuit</span><span class="name">Arphan Drame<span>arphandrame.fr</span></span></div>
  </div>
  <div class="vis" aria-hidden="true">
    <div class="browser"><div class="bar"><i></i><i></i><i></i></div><img src="../assets/img/projets/wild-kedougou.webp" alt=""></div>
    <div class="phone"><img src="../assets/img/projets/islaah-home-logged-in.webp" alt=""></div>
  </div>
</body>
</html>
