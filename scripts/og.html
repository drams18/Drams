<!DOCTYPE html>
<!-- Source de l'image de partage (assets/img/og.jpg, 1200×630).
     Régénérée avec les miniatures : npm run capture -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../node_modules/@fontsource-variable/inter/index.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; color: #f4f4f5; -webkit-font-smoothing: antialiased;
      font-family: 'Inter Variable', -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0d;
    }
    body::before {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 80% 0%, #000 30%, transparent 100%);
    }
    body::after {
      content: ''; position: absolute; top: -260px; right: -160px; width: 760px; height: 760px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(99,102,241,.34), transparent);
    }
    .card { position: absolute; z-index: 1; left: 88px; top: 96px; right: 88px; }
    .pill { display: inline-flex; align-items: center; gap: 14px; padding: 10px 22px 10px 18px; font-size: 24px; font-weight: 500; color: #d4d4d8;
      border: 1.5px solid #34343e; border-radius: 999px; background: rgba(19,19,24,.7); }
    .pill i { width: 12px; height: 12px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 6px rgba(52,211,153,.18); }
    h1 { margin: 40px 0 0; font-size: 104px; font-weight: 700; letter-spacing: -.045em; line-height: 1;
      background: linear-gradient(180deg, #f4f4f5 30%, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; padding-bottom: 8px; }
    .job { margin: 22px 0 0; font-size: 42px; font-weight: 600; letter-spacing: -.02em; }
    .loc { margin: 12px 0 0; font-size: 28px; color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="card">
    <p class="pill" style="margin:0"><i></i>En recherche de CDI (dès sept. 2026)</p>
    <h1>Arphan Drame</h1>
    <p class="job">Développeur Web Full Stack</p>
    <p class="loc">Frontend &amp; Backend — Île-de-France</p>
  </div>
</body>
</html>
