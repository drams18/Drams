  <script>
    Deeplink.rewriteHomeLinks(document, false);
    // « Construisez votre projet » : le mini-jeu pour un visiteur du mode
    // aventure, le formulaire classique pour tous les autres.
    window.projectHref = function () {
      return Deeplink.getMode() === 'aventure' ? '/construire-projet' : '/devis';
    };

    // Barre du haut : menu mobile et fond au défilement (comme js/classic.js,
    // qui n'est pas chargé ici : il forcerait le mode « classique »).
    (function () {
      var nav = document.getElementById('site-nav');
      var toggle = document.querySelector('.nav-toggle');
      var topbar = document.querySelector('.topbar');
      function setNav(open) {
        nav.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        toggle.setAttribute('aria-label', open ? 'Fermer le menu' : 'Ouvrir le menu');
      }
      toggle.addEventListener('click', function () { setNav(!nav.classList.contains('is-open')); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && nav.classList.contains('is-open')) { setNav(false); toggle.focus(); }
      });
      document.addEventListener('click', function (e) {
        if (nav.classList.contains('is-open') && !e.target.closest('#site-nav, .nav-toggle')) setNav(false);
      });
      function onScroll() { topbar.classList.toggle('is-scrolled', window.scrollY > 24); }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>

        kw: 'espace client back office intranet administration zone privee gestion utilisateurs contenus crud portail interne extranet' },

        kw: 'authentification auth connexion login inscription jwt sso oauth roles permissions droits acces securite session mot de passe' },
      { profile: 'professionnels', name: 'Intégration IA / LLM', price: '900 €', from: true,

        cats: ['modules-pro'],
        kw: 'ia intelligence artificielle llm gpt openai chatbot rag resume classification extraction embeddings vecteur assistant modele local prompt' },
      { profile: 'professionnels', name: 'Collecte de données / scraping cadré', price: '450 €', from: true,
        desc: 'Extraction structurée de données publiques, dans un cadre légal.',

        kw: 'scraping collecte donnees extraction crawl parsing web data mining automatisation puppeteer playwright api structuree veille' },

      { profile: 'professionnels', name: 'Mise en place Docker + CI/CD', price: '500 €', from: true,
        desc: 'Conteneurisation et pipeline de déploiement automatisé.',
        cats: ['infra-pro'],
        kw: 'docker conteneur container ci cd pipeline gitlab github actions integration continue deploiement automatise build image devops' },
      { profile: 'professionnels', name: 'Déploiement & infrastructure', price: '350 €', from: true,
        desc: 'VPS, Nginx, Cloudflare, nom de domaine et certificat SSL.',
        cats: ['infra-pro'],
        kw: 'deploiement infrastructure serveur vps nginx cloudflare dns nom de domaine ssl https mise en production hebergement cloud aws gcp' },
      { profile: 'professionnels', name: 'Migration de base de données', price: '400 €', from: true,
        desc: 'Schéma, données et scripts de migration versionnés.',
        cats: ['infra-pro'],
        kw: 'migration base de donnees database schema donnees postgresql mysql prisma typeorm script versionne import export transfert' },
      { profile: 'professionnels', name: 'Mise en place de tests automatisés', price: '500 €', from: true,
        desc: 'Tests unitaires et end-to-end (Jest, Cypress, Playwright).',
        cats: ['infra-pro', 'suivi-pro'],
        kw: 'tests automatises test unitaire end to end e2e jest cypress playwright vitest recette qualite couverture non regression ci' },
      { profile: 'professionnels', name: 'Publication sur les stores', price: '300 €', from: true,
        desc: 'App Store et Play Store : comptes, fiches, build et envoi.',
        cats: ['infra-pro'],
        kw: 'publication store app store play store apple google fiche build ipa aab testflight review compte developpeur application mobile' },

      { profile: 'professionnels', name: "Passage d'une app web en PWA / mobile", price: '600 €', from: true,
        desc: 'App web installable ou portée en application mobile.',
        cats: ['app-pro'],
        kw: 'pwa progressive web app installable mobile portage react native wrapper application web hors ligne notification push store' }
    ];

    /* ── Synonymes appliqués aux mots de la requête ─────── */
    var SYNONYMS = {
      boutique:      ['shopify', 'ecommerce', 'vendre', 'commerce', 'magasin'],
      magasin:       ['shopify', 'ecommerce', 'boutique', 'commerce'],
      vendre:        ['ecommerce', 'shopify', 'boutique', 'commerce'],
      vente:         ['ecommerce', 'shopify', 'boutique', 'commerce'],
      ecommerce:     ['shopify', 'boutique', 'vendre', 'commerce'],
      commerce:      ['ecommerce', 'shopify', 'boutique'],
      wp:            ['wordpress'],
      cms:           ['wordpress'],
      blog:          ['wordpress'],
      site:          ['vitrine'],
      internet:      ['site', 'web', 'vitrine'],
      web:           ['site', 'internet'],
      appli:         ['application', 'app'],
      app:           ['application'],
      logiciel:      ['application', 'saas'],
      mobile:        ['application', 'ios', 'android'],
      logo:          ['identite', 'graphisme', 'visuel', 'marque'],
      graphisme:     ['logo', 'visuel', 'banniere'],
      bug:           ['depannage', 'correction', 'probleme', 'erreur'],
      probleme:      ['depannage', 'bug', 'correction', 'aide'],
      panne:         ['depannage', 'correction', 'bug'],
      reparer:       ['depannage', 'correction', 'bug'],
      cours:         ['initiation', 'formation', 'apprendre'],
      formation:     ['initiation', 'cours', 'apprendre'],
      apprendre:     ['initiation', 'formation', 'cours'],
      prof:          ['initiation', 'formation', 'cours'],
      hebergement:   ['mise en ligne', 'domaine', 'deploiement'],
      domaine:       ['mise en ligne', 'hebergement', 'dns'],
      deployer:      ['mise en ligne', 'deploiement', 'hebergement'],
      referencement: ['seo', 'vitrine'],
      seo:           ['referencement', 'vitrine'],
      portfolio:     ['book', 'vitrine', 'projets'],
      book:          ['portfolio'],
      cv:            ['curriculum', 'resume'],
      refonte:       ['refaire', 'redesign', 'modification', 'moderniser', 'relooking'],
      moderniser:    ['refonte', 'redesign', 'relooking'],
      maintenance:   ['suivi', 'entretien', 'infogerance'],
      devis:         ['personnalise', 'sur mesure'],
      etudiant:      ['ecole', 'universite', 'memoire', 'scolaire'],
      banniere:      ['visuel', 'reseaux sociaux', 'graphisme'],
      backend:       ['api', 'serveur', 'base de donnees'],
      api:           ['backend', 'serveur'],
      pwa:           ['installable', 'hors ligne', 'application', 'mobile'],
      reservation:   ['rdv', 'rendez vous', 'booking', 'agenda', 'creneaux'],
      rdv:           ['reservation', 'rendez vous', 'agenda', 'booking'],
      dashboard:     ['tableau de bord', 'reporting', 'statistiques', 'kpi'],
      reporting:     ['dashboard', 'tableau de bord', 'rapport', 'export'],
      docker:        ['conteneur', 'devops', 'ci', 'cd'],
      devops:        ['docker', 'ci', 'cd', 'deploiement', 'infra'],
      infra:         ['infrastructure', 'serveur', 'deploiement', 'vps'],
      scraping:      ['collecte', 'donnees', 'extraction'],
      tests:         ['test', 'recette', 'jest', 'cypress', 'playwright'],
      ia:            ['intelligence artificielle', 'llm', 'chatbot', 'gpt'],
      chatbot:       ['ia', 'llm', 'assistant', 'bot'],
      newsletter:    ['emailing', 'email', 'brevo', 'mailchimp'],
      emailing:      ['newsletter', 'email', 'brevo', 'mailchimp'],
      figma:         ['maquette', 'design', 'integration'],
      maquette:      ['figma', 'design', 'integration'],
      authentification: ['auth', 'connexion', 'login', 'jwt', 'sso', 'roles'],
      vitesse:       ['performance', 'pagespeed', 'optimisation', 'rapidite'],
      performance:   ['vitesse', 'pagespeed', 'optimisation']
    };

    /* ── Normalisation (minuscule, sans accents, alphanum) ─ */
    var DIACRITICS = new RegExp('[\\u0300-\\u036f]', 'g');
    function norm(s) {
      return String(s == null ? '' : s)
        .toLowerCase()
        .normalize('NFD').replace(DIACRITICS, '')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim();
    }

    /* Index de recherche pré-calculé pour chaque prestation. */
    SERVICES.forEach(function (s) {
      var catLabels = s.cats.map(function (cid) {
        var list = CATEGORIES[s.profile] || [];
        for (var i = 0; i < list.length; i++) if (list[i].id === cid) return list[i].label;
        return '';
      }).join(' ');
      s._name = norm(s.name);
      s._cat  = norm(catLabels);
      s._hay  = norm([s.name, s.desc || '', s.kw, catLabels, PROFILES[s.profile].label].join(' '));
      s._words = s._hay.split(' ');
    });

    var STOP = {
      de: 1, du: 1, des: 1, la: 1, le: 1, les: 1, un: 1, une: 1, et: 1, ou: 1,
      en: 1, au: 1, aux: 1, sur: 1, dans: 1, par: 1, pour: 1, avec: 1,
      je: 1, mon: 1, ma: 1, mes: 1, ce: 1, cette: 1, quel: 1, quelle: 1
    };
    function tokens(str) {
      return norm(str).split(' ').filter(function (t) {
        return t.length >= 2 && !STOP[t];
      });
    }

    /* Correspondance ancrée sur le mot : égalité, ou préfixe
       (« word » → « wordpress », « appli » → « application »). */
    function wordMatch(tok, words) {
      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        if (w === tok) return true;
        if (tok.length >= 3 && w.length > tok.length && w.indexOf(tok) === 0) return true;
      }
      return false;
    }

    /* Un mot de la requête compte s'il correspond lui-même OU l'un de
       ses synonymes. Tous les mots doivent correspondre (ET). */
    function tokenHits(tok, svc) {
      if (wordMatch(tok, svc._words)) return true;
      var syn = SYNONYMS[tok];
      if (syn) for (var i = 0; i < syn.length; i++) {
        var sv = norm(syn[i]);
        if (sv.indexOf(' ') !== -1
              ? svc._hay.indexOf(sv) !== -1
              : wordMatch(sv, svc._words)) return true;
      }
      return false;
    }

    function scoreService(toks, svc) {
      var score = 0;
      for (var i = 0; i < toks.length; i++) {
        var t = toks[i];
        if (!tokenHits(t, svc)) return -1;              // AND : tout doit matcher
        if (svc._name.indexOf(t) !== -1) score += 10;
        else if (svc._cat.indexOf(t) !== -1) score += 4;
        else score += 1;
      }
      if (svc._name === toks.join(' ')) score += 20;
      return score;
    }

    function search(query) {
      var toks = tokens(query);
      if (!toks.length) return null;
      var hits = [];
      SERVICES.forEach(function (svc) {
        var sc = scoreService(toks, svc);
        if (sc >= 0) hits.push({ svc: svc, score: sc });
      });
      hits.sort(function (a, b) { return b.score - a.score; });
      return hits.map(function (h) { return h.svc; });
    }

    /* ── Fabrique de DOM ────────────────────────────────── */
    function el(tag, cls, text) {
      var n = doc.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function plural(n, word) { return n + ' ' + word + (n > 1 ? 's' : ''); }

    function inCategory(profile, catId) {
      return SERVICES.filter(function (s) {
        return s.profile === profile && s.cats.indexOf(catId) !== -1;
      });
    }

    /* Carte de choix (profil, besoin) : un vrai lien vers l'écran suivant. */
    function pick(hash, label, hint, cls) {
      var a = el('a', 'pick' + (cls ? ' ' + cls : ''));
      a.href = '#' + hash;
      a.appendChild(el('span', 'pick__label', label));
      a.appendChild(el('span', 'pick__hint', hint));
      return a;
    }

    /* Prestation : nom + prix ; la description s'ouvre au clic
       (une seule ouverte à la fois, attribut name des <details>). */
    function serviceItem(svc) {
      var li = el('li', 'svc-item');
      var d = el('details', 'svc');
      d.setAttribute('name', 'svc');

      var head = el('summary', 'svc__head');
      head.appendChild(el('span', 'svc__name', svc.name));
      var p = el('span', 'svc__price');
      if (svc.from) p.appendChild(el('span', 'svc__from', 'à partir de'));
      p.appendChild(el('span', 'svc__amount', svc.price));
      if (svc.unit) p.appendChild(el('span', 'svc__unit', svc.unit));
      head.appendChild(p);
      var chev = el('span', 'svc__chev');
      chev.setAttribute('aria-hidden', 'true');
      head.appendChild(chev);

      d.appendChild(head);
      d.appendChild(el('p', 'svc__desc', svc.desc));
      li.appendChild(d);
      return li;
    }

    /* Liste de prestations dans un panneau, limitée à LIMIT lignes. */
    function servicePanel(list, title) {
      var panel = el('section', 'panel');
      if (title) panel.appendChild(el('h2', 'panel__title', title));

      var ul = el('ul', 'svc-list');
      var items = list.map(serviceItem);
      // Pas de bouton pour une ou deux lignes de plus.
      var cut = items.length > LIMIT + 2 ? LIMIT : items.length;
      items.forEach(function (li, i) {
        if (i >= cut) li.hidden = true;
        ul.appendChild(li);
      });
      panel.appendChild(ul);

      if (cut < items.length) {
        var rest = items.length - cut;
        var more = el('button', 'more', 'Afficher les ' + rest + ' autres prestations');
        more.type = 'button';
        more.addEventListener('click', function () {
          items.forEach(function (li) { li.hidden = false; });
          more.remove();
          items[cut].querySelector('summary').focus();
        });
        panel.appendChild(more);
      }
      return panel;
    }

    /* Une ligne d'aide sous chaque écran. */
    function helpLine(profile) {
      var p = el('p', 'help-line');
      p.appendChild(el('span', null, 'Vous hésitez ?'));

      var build = el('a', 'text-link', 'Construisez votre projet');
      build.href = projectHref();
      build.insertAdjacentHTML('beforeend',
        '<svg class="ico" aria-hidden="true" focusable="false"><use href="#i-arrow"/></svg>');
      p.appendChild(build);

      var devis = el('button', 'inline-link', 'Demander un devis');
      devis.type = 'button';
      devis.setAttribute('data-contact-cta', '');
      devis.setAttribute('data-contact-subject',
        'Demande de devis personnalisé' + (profile ? ' · ' + PROFILES[profile].label : ''));
      p.appendChild(devis);
      return p;
    }

    /* ── Vues : { title, sub, crumbs, body } ───────────── */
    var ROOT = { label: 'Tarifs', hash: 'choix' };

    function viewProfile() {
      var grid = el('div', 'pick-grid');
      grid.appendChild(pick('particuliers', 'Particuliers',
        'Site, dépannage, CV, visuels, accompagnement.', 'pick--lg pick--perso'));
      grid.appendChild(pick('professionnels', 'Professionnels',
        'Site, e-commerce, application, maintenance.', 'pick--lg pick--pro'));
      return {
        title: 'Mes tarifs', sub: 'Pour qui est ce projet ?', docTitle: 'Tarifs',
        crumbs: [], body: [grid, helpLine(null)]
      };
    }

    function viewCategories(profile) {
      var grid = el('div', 'pick-grid');
      CATEGORIES[profile].forEach(function (cat) {
        grid.appendChild(pick(profile + '/' + cat.id, cat.label, cat.hint));
      });
      return {
        title: PROFILES[profile].title, sub: 'Quel est votre besoin ?', docTitle: PROFILES[profile].title,
        crumbs: [ROOT, { label: PROFILES[profile].label }],
        body: [grid, helpLine(profile)]
      };
    }

    function viewServices(profile, catId) {
      var cat = CATEGORIES[profile].filter(function (c) { return c.id === catId; })[0];
      var list = inCategory(profile, catId);
      return {
        title: cat.label,
        sub: plural(list.length, 'prestation') + '. Touchez une ligne pour le détail.',
        docTitle: cat.label + ' · ' + PROFILES[profile].title,
        crumbs: [ROOT, { label: PROFILES[profile].label, hash: profile }, { label: cat.label }],
        body: [servicePanel(list), helpLine(profile)]
      };
    }

    function viewSearch(query) {
      var q = query.trim();
      var results = search(query) || [];
      var view = {
        title: 'Recherche', docTitle: 'Recherche',
        crumbs: [ROOT, { label: 'Recherche' }]
      };

      if (!results.length) {
        var nr = el('div', 'noresult');
        nr.appendChild(el('p', null, 'Votre besoin est peut-être spécifique : parlons-en.'));
        var btn = el('button', 'btn btn-cta', 'Me contacter');
        btn.type = 'button';
        btn.addEventListener('click', function () {
          openContact(
            'Demande d\'information : ' + q,
            'Bonjour, je souhaiterais avoir des informations concernant : ' + q + '.'
          );
        });
        nr.appendChild(btn);
        view.sub = 'Aucune prestation pour « ' + q + ' ».';
        view.body = [nr, helpLine(null)];
        return view;
      }

      view.sub = plural(results.length, 'résultat') + ' pour « ' + q + ' ».';
      view.body = [];
      ['particuliers', 'professionnels'].forEach(function (prof) {
        var group = results.filter(function (s) { return s.profile === prof; });
        if (group.length) view.body.push(servicePanel(group, PROFILES[prof].label));
      });
      return view;
    }

    /* ── Contact (réutilise js/contact.js) ─────────────── */
    function openContact(subject, body) {
      if (window.ContactWidget && window.ContactWidget.open) {
        window.ContactWidget.open({ subject: subject, body: body });
      } else {
        window.location.href = 'mailto:arphandrame0@gmail.com' +
          '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
      }
    }

    /* ── Routage par hash ──────────────────────────────── */
    function parseHash() {
      var parts = (location.hash || '').replace(/^#/, '').split('/').filter(Boolean);
      var profile = PROFILES[parts[0]] ? parts[0] : null;
      var category = null;
      if (profile && parts[1]) {
        var ok = CATEGORIES[profile].some(function (c) { return c.id === parts[1]; });
        if (ok) category = parts[1];
      }
      return { profile: profile, category: category };
    }

    function searchActive() { return tokens(input.value).length > 0; }

    function clearSearch() {
      input.value = '';
      clearBtn.hidden = true;
      lastWasSearch = false;
    }

    /* Fil d'Ariane : les étapes précédentes sont des liens (retour). */
    function renderCrumbs(crumbs) {
      crumbsEl.innerHTML = '';
      crumbsEl.hidden = !crumbs.length;
      if (!crumbs.length) return;
      var ol = el('ol');
      crumbs.forEach(function (c) {
        var li = el('li');
        if (c.hash) {
          var a = el('a', null, c.label);
          a.href = '#' + c.hash;
          a.addEventListener('click', function (e) {
            // Quitte la recherche ; même hash → pas de hashchange, on rend ici.
            e.preventDefault();
            clearSearch();
            if (location.hash === '#' + c.hash) render(true);
            else location.hash = c.hash;
          });
          li.appendChild(a);
        } else {
          var here = el('span', null, c.label);
          here.setAttribute('aria-current', 'page');
          li.appendChild(here);
        }
        ol.appendChild(li);
      });
      crumbsEl.appendChild(ol);
    }

    function render(moved) {
      var isSearch = searchActive();
      var r = parseHash();
      var view = isSearch ? viewSearch(input.value)
        : !r.profile ? viewProfile()
        : !r.category ? viewCategories(r.profile)
        : viewServices(r.profile, r.category);

      // En recherche, le fil ramène à l'écran d'où l'on vient.
      if (isSearch && r.profile) {
        view.crumbs = [ROOT, { label: PROFILES[r.profile].label, hash: r.profile }, { label: 'Recherche' }];
      }

      titleEl.textContent = view.title;
      subEl.textContent = view.sub;
      statusEl.textContent = isSearch ? view.sub : '';
      document.title = view.docTitle + ' · Arphan Drame';
      renderCrumbs(view.crumbs);

      mainEl.innerHTML = '';
      view.body.forEach(function (n) { mainEl.appendChild(n); });

      // (Re)câble les CTA de devis générés dynamiquement.
      if (window.ContactWidget && window.ContactWidget.init) {
        window.ContactWidget.init(mainEl);
      }

      // Changement d'écran : retour en haut, le titre reçoit le focus
      // (lecteurs d'écran, clavier), sauf pendant la saisie d'une recherche.
      if (moved) {
        window.scrollTo(0, 0);
        if (doc.activeElement !== input) titleEl.focus({ preventScroll: true });
      }
    }

    /* ── Écouteurs ─────────────────────────────────────── */
    var lastWasSearch = false;
    input.addEventListener('input', function () {
      clearBtn.hidden = !input.value.length;
      var isSearch = searchActive();
      // scroll en haut seulement lorsqu'on bascule dans/hors recherche
      render(isSearch !== lastWasSearch);
      lastWasSearch = isSearch;
    });

    clearBtn.addEventListener('click', function () {
      clearSearch();
      input.focus();
      render(false);
    });

    window.addEventListener('hashchange', function () {
      // Un choix fait depuis l'écran courant sort de la recherche.
      clearSearch();
      render(true);
    });

    render(false);
  })();
  </script>
