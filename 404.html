<!DOCTYPE html>
<html lang="fr" data-theme="night" data-analytics-path="/404">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page introuvable · Arphan Drame</title>
  <meta name="robots" content="noindex">
  <!-- Cloudflare Pages sert cette page pour toute URL inconnue (même
       /a/b/c) : chemins ABSOLUS depuis la racine du site.
       data-analytics-path : l'adresse saisie n'est pas transmise à la mesure
       d'audience (js/analytics.js), seulement « /404 ». -->
  <script src="/js/theme.js"></script>
  <link rel="icon" href="/assets/img/favicon.png" sizes="96x96">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/classic.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .lost__card { max-width: 480px; }
    .lost__code { font-size: clamp(64px, 14vw, 112px); font-weight: 700; line-height: 1; letter-spacing: -.05em; color: var(--text); }
    .lost__text { margin: 18px 0 28px; color: var(--muted); }
    .lost__actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  </style>
</head>
<body>
  <main class="lost">
    
    <div class="lost__card">
      <h1 class="lost__code">404</h1>
      <p class="lost__text">Cette rue n'existe pas dans la ville. Reprenez depuis l'accueil, ou retournez explorer.</p>
      <div class="lost__actions">
        <a class="btn btn--primary" href="/classique">Mode classique</a>
        <a class="btn btn--ghost" href="/aventure">Mode aventure</a>
        <a class="btn btn--ghost" href="/">Choisir un mode</a>
      </div>
    </div>
  </main>
  <script src="/js/consent.js" defer></script>
  <script src="/js/analytics.js" defer></script>
  <script src="/js/analytics-events.js" defer></script>
</body>
</html>
