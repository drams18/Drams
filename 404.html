<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page introuvable — Arphan Drame</title>
  <meta name="robots" content="noindex">
  <!-- GitHub Pages sert cette page pour n'importe quelle URL inconnue du site
       (y compris /Drams/a/b/c) : chemins résolus depuis la racine du projet. -->
  <base href="/Drams/">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/classic.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 32px 16px; position: relative; overflow: hidden; }
    .lost .hero__bg { position: absolute; }
    .lost__card { position: relative; max-width: 460px; padding: 28px 22px; }
    .lost__code { font-family: var(--pixel-font); font-size: clamp(34px, 9vw, 56px); color: var(--paper); text-shadow: -0.06em 0 0 var(--red), 0.06em 0 0 var(--cyan); }
    .lost__text { margin: 18px 0 24px; color: #d5dbe6; }
    .lost__actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  </style>
</head>
<body>
  <main class="lost">
    <div class="hero__bg" aria-hidden="true"></div>
    <div class="card lost__card">
      <h1 class="lost__code">404</h1>
      <p class="lost__text">Cette rue n'existe pas dans la ville. Reprenez depuis le portfolio, ou retournez explorer.</p>
      <div class="lost__actions">
        <a class="btn btn--primary" href="./">Mode classique</a>
        <a class="btn btn--ghost" href="aventure.html#ville">Mode aventure</a>
      </div>
    </div>
  </main>
</body>
</html>
