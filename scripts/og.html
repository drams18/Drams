<!DOCTYPE html>
<!-- Source de l'image de partage (assets/img/og.png, 1200×630).
     Régénérer (serveur local lancé à la racine du repo, ex. python3 -m http.server 8765) :
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --window-size=1200,630 --virtual-time-budget=2000 \
       --screenshot=assets/img/og.png http://localhost:8765/scripts/og.html -->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; font-family: var(--body-font); color: var(--paper);
      background:
        radial-gradient(60% 70% at 10% 10%, rgba(255,43,176,.28) 0%, transparent 60%),
        radial-gradient(60% 80% at 95% 15%, rgba(138,59,255,.30) 0%, transparent 60%),
        linear-gradient(180deg, #0e1630 0%, #16234a 60%, #0e1630 100%);
    }
    body::before { content: ''; position: absolute; inset: 0; opacity: .6;
      background-image: var(--weblines), var(--halftone); background-size: auto, auto, var(--halftone-size); }
    .sky { position: absolute; left: 0; right: 0; bottom: 0; height: 170px; background: #05070f;
      clip-path: polygon(0 90px, 3% 90px, 3% 60px, 6% 60px, 6% 80px, 9% 80px, 9% 36px, 11% 36px, 11% 70px, 15% 70px, 15% 24px, 17% 24px, 17% 64px, 21% 64px, 21% 44px, 25% 44px, 25% 86px, 29% 86px, 29% 20px, 31% 20px, 31% 58px, 35% 58px, 35% 38px, 39% 38px, 39% 80px, 43% 80px, 43% 30px, 46% 30px, 46% 66px, 50% 66px, 50% 18px, 52% 18px, 52% 56px, 56% 56px, 56% 40px, 60% 40px, 60% 84px, 64% 84px, 64% 26px, 67% 26px, 67% 62px, 71% 62px, 71% 34px, 75% 34px, 75% 76px, 79% 76px, 79% 22px, 81% 22px, 81% 54px, 85% 54px, 85% 42px, 89% 42px, 89% 82px, 93% 82px, 93% 30px, 96% 30px, 96% 64px, 100% 64px, 100% 170px, 0 170px);
      filter: drop-shadow(0 -2px 4px rgba(25,232,255,.6)); }
    .card { position: absolute; left: 80px; top: 70px; right: 80px; }
    .tag { display: inline-block; padding: 8px 14px; font-family: var(--pixel-font); font-size: 14px; letter-spacing: 3px;
      color: var(--cyan); border: 3px solid var(--cyan); box-shadow: 4px 4px 0 var(--stroke); }
    h1 { margin: 34px 0 0; font-family: var(--pixel-font); font-weight: 400; font-size: 64px; letter-spacing: 3px; line-height: 1.3;
      text-shadow: -0.05em 0 0 var(--red), 0.05em 0 0 var(--cyan); }
    .job { margin-top: 22px; font-size: 40px; font-weight: 800; }
    .loc { margin-top: 6px; font-size: 24px; color: #9fd9e6; }
    .seek { display: inline-flex; align-items: center; gap: 14px; margin-top: 30px; padding: 12px 20px; font-size: 28px; font-weight: 800;
      background: rgba(255,18,61,.18); border: 3px solid var(--red); box-shadow: 5px 5px 0 var(--stroke); }
    .seek i { width: 14px; height: 14px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 6px rgba(255,18,61,.25); }
  </style>
</head>
<body>
  <div class="card">
    <span class="tag">PORTFOLIO</span>
    <h1>ARPHAN DRAME</h1>
    <p class="job" style="margin-bottom:0">Développeur Web Full Stack</p>
    <p class="loc" style="margin:6px 0 0">Frontend &amp; Backend — Île-de-France</p>
    <p class="seek"><i></i>En recherche de CDI (dès sept. 2026)</p>
  </div>
  <div class="sky"></div>
</body>
</html>
