<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Construisez votre projet — Arphan DRAME</title>
  <meta name="description" content="Construisez votre demande de projet pas à pas, dans l'univers du portfolio d'Arphan DRAME.">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Page « Construisez votre projet » — extension du jeu ── */
    .hidden { display: none !important; }

    #bpCanvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Bouton « étape précédente » — même look que le bouton Accueil du jeu */
    .bp-back-btn { z-index: 40; }
    .bp-back-btn::before { transform: rotate(180deg); }

    /* HUD haut de l'écran */
    .bp-hud {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: min(92vw, 540px);
      text-align: center;
      background: rgba(6,10,16,0.58);
      border: 2px solid rgba(255,255,255,0.14);
      padding: 8px 14px 10px;
      backdrop-filter: blur(3px);
      pointer-events: none;
    }
    .bp-hud__counter {
      font-family: var(--pixel-font);
      font-size: 8px;
      letter-spacing: 2px;
      color: var(--mc-gold);
      text-shadow: 1px 1px 0 rgba(0,0,0,0.7);
    }
    .bp-hud__title {
      font-family: var(--pixel-font);
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 1px;
      color: #fff;
      margin: 7px 0 4px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
    }
    .bp-hud__help {
      font-family: var(--body-font);
      font-size: 12.5px;
      line-height: 1.5;
      color: #cdd8e6;
    }
    .bp-quit {
      pointer-events: auto;
      margin-top: 9px;
      font-family: var(--body-font);
      font-size: 11.5px;
      color: #9fb2c6;
      background: transparent;
      border: none;
      border-bottom: 1px dotted #9fb2c6;
      padding: 2px 0;
      cursor: pointer;
    }
    .bp-quit:hover { color: #fff; border-bottom-color: #fff; }

    @media (max-width: 720px) {
      .bp-hud { top: 54px; width: 94vw; padding: 7px 10px 9px; }
      .bp-hud__title { font-size: 9.5px; }
      .bp-hud__help { font-size: 11.5px; }
    }
    @media (max-width: 380px) {
      .bp-hud__help { display: none; }
    }

    /* Le toast ne doit pas passer sous la barre de boutons mobile */
    @media (max-width: 720px) {
      #bp-toast { bottom: 92px; }
    }

    /* Voile de transition entre les étapes */
    #bp-fade {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: #0a0a12;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
    }
    #bp-fade.bp-fade--on { opacity: 1; }

    /* Panneaux plein écran (récap / formulaire / confirmation) */
    .bp-panel {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 24px 16px 90px;
      background: rgba(4,7,12,0.86);
      backdrop-filter: blur(4px);
      animation: bpPanelIn 0.28s ease;
    }
    @keyframes bpPanelIn { from { opacity: 0; } to { opacity: 1; } }

    .bp-panel__card {
      width: 100%;
      max-width: 460px;
      margin: auto;
      background: #0e1215;
      border: 2px solid var(--mc-gold);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.6);
      padding: 20px 20px 22px;
    }
    .bp-panel__card--center { text-align: center; }

    .bp-panel__title {
      font-family: var(--pixel-font);
      font-size: 13px;
      letter-spacing: 1.5px;
      color: var(--mc-gold);
      text-shadow: 0 0 10px rgba(255,215,0,0.4);
      margin-bottom: 14px;
    }
    .bp-panel__intro {
      font-family: var(--body-font);
      font-size: 12.5px;
      line-height: 1.55;
      color: #9aa7bb;
      margin-bottom: 14px;
    }

    /* Récapitulatif */
    .bp-recap-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
    .bp-recap-row {
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.09);
    }
    .bp-recap-row dt {
      font-family: var(--pixel-font);
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--mc-gold);
      margin-bottom: 6px;
    }
    .bp-recap-row dd {
      font-family: var(--body-font);
      font-size: 14px;
      color: #fff;
      line-height: 1.5;
    }

    /* Formulaire */
    .bp-field { display: block; margin-bottom: 13px; }
    .bp-field__label {
      display: block;
      font-family: var(--body-font);
      font-size: 12px;
      font-weight: 600;
      color: #cdd8e6;
      margin-bottom: 6px;
    }
    .bp-input {
      width: 100%;
      font-family: var(--body-font);
      font-size: 15px;
      color: #fff;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.2);
      border-left: 3px solid var(--mc-gold);
      padding: 11px 12px;
      outline: none;
    }
    .bp-input:focus { border-color: var(--mc-gold); background: rgba(255,255,255,0.07); }
    .bp-textarea { resize: vertical; min-height: 84px; }

    .bp-panel__actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }
    .bp-btn {
      flex: 1 1 auto;
      min-width: 140px;
      font-family: var(--pixel-font);
      font-size: 9px;
      letter-spacing: 1px;
      text-align: center;
      text-decoration: none;
      padding: 13px 14px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.1s, background 0.15s, border-color 0.15s;
    }
    .bp-btn:active { transform: translateY(2px); }
    .bp-btn--primary {
      background: var(--mc-green);
      color: #fff;
      box-shadow: 0 4px 0 #2d4e15;
    }
    .bp-btn--primary:hover { background: #69b436; }
    .bp-btn--ghost {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.28);
      color: #cdd8e6;
    }
    .bp-btn--ghost:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.5); }

    .bp-form-status {
      font-family: var(--body-font);
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
      margin-top: 12px;
      color: #9aa7bb;
    }
    .bp-form-status--error { color: #ff8a80; }

    .bp-panel__exit {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-family: var(--body-font);
      font-size: 11.5px;
      color: #9aa7bb;
    }
    .bp-panel__exit:hover { color: #fff; }

    .bp-done-text {
      font-family: var(--body-font);
      font-size: 14.5px;
      line-height: 1.7;
      color: #dfe7f0;
      margin-bottom: 20px;
    }
    .bp-panel__card--center .bp-btn { flex: 0 1 auto; min-width: 200px; }

    @media (max-width: 480px) {
      .bp-panel { padding: 18px 12px 96px; }
      .bp-panel__card { padding: 18px 16px 20px; }
      .bp-btn { min-width: 100%; }
    }
  </style>
</head>
<body>
  <button id="btn-sound" type="button" class="sound-toggle" aria-pressed="true"
          aria-label="Activer ou couper tous les sons">
    <span class="sound-toggle__label">SOUND ON</span>
  </button>

  <canvas id="bpCanvas"></canvas>

  <button id="bp-back" type="button" class="game-home-btn bp-back-btn">Etape precedente</button>

  <div id="bp-hud" class="bp-hud">
    <div class="bp-hud__counter" id="bp-counter">ETAPE 1 / 5</div>
    <h1 class="bp-hud__title" id="bp-title">QUE VOULEZ-VOUS CREER ?</h1>
    <p class="bp-hud__help" id="bp-help"></p>
    <button type="button" id="bp-quit" class="bp-quit">Revenir au portfolio</button>
  </div>

  <div id="bp-toast" class="toast hidden"></div>

  <!-- RECAPITULATIF -->
  <section id="bp-recap" class="bp-panel hidden" aria-label="Recapitulatif de votre projet">
    <div class="bp-panel__card">
      <h2 class="bp-panel__title">VOTRE PROJET</h2>
      <dl class="bp-recap-list" id="bp-recap-list"></dl>
      <div class="bp-panel__actions">
        <button type="button" class="bp-btn bp-btn--ghost" id="bp-recap-edit">Modifier mes choix</button>
        <button type="button" class="bp-btn bp-btn--primary" id="bp-recap-next">Continuer</button>
      </div>
      <a class="bp-panel__exit" href="index.html">Revenir au portfolio</a>
    </div>
  </section>

  <!-- FORMULAIRE -->
  <section id="bp-form" class="bp-panel hidden" aria-label="Formulaire de contact">
    <div class="bp-panel__card">
      <h2 class="bp-panel__title">PARLONS DE VOTRE PROJET</h2>
      <p class="bp-panel__intro">Les champs marqués d'un astérisque (*) sont obligatoires.</p>
      <form id="bp-form-el" novalidate>
        <label class="bp-field">
          <span class="bp-field__label">Prénom *</span>
          <input class="bp-input" name="client_prenom" type="text" autocomplete="given-name" required>
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Nom *</span>
          <input class="bp-input" name="client_nom" type="text" autocomplete="family-name" required>
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Adresse e-mail *</span>
          <input class="bp-input" name="client_email" type="email" autocomplete="email" required>
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Téléphone (facultatif)</span>
          <input class="bp-input" name="client_tel" type="tel" autocomplete="tel">
        </label>
        <label class="bp-field">
          <span class="bp-field__label">Message / précisions supplémentaires</span>
          <textarea class="bp-input bp-textarea" name="client_message" id="bp-msg" rows="4"></textarea>
        </label>

        <input type="hidden" name="from_name">
        <input type="hidden" name="from_email">
        <input type="hidden" name="message">

        <div class="bp-panel__actions">
          <button type="button" class="bp-btn bp-btn--ghost" id="bp-form-back">Retour</button>
          <button type="submit" class="bp-btn bp-btn--primary" id="bp-form-submit">Envoyer ma demande</button>
        </div>
        <p class="bp-form-status" id="bp-form-status" role="status" aria-live="polite"></p>
      </form>
      <a class="bp-panel__exit" href="index.html">Revenir au portfolio</a>
    </div>
  </section>

  <!-- CONFIRMATION -->
  <section id="bp-done" class="bp-panel hidden" aria-label="Demande envoyee">
    <div class="bp-panel__card bp-panel__card--center">
      <h2 class="bp-panel__title">PROJET TRANSMIS</h2>
      <p class="bp-done-text">Merci pour votre demande.<br>Je reviendrai vers vous rapidement.</p>
      <a class="bp-btn bp-btn--primary" href="index.html">Retour au portfolio</a>
    </div>
  </section>

  <script>
    if (/Mobi|Android/i.test(navigator.userAgent)) {
      document.querySelectorAll('.desktop-only').forEach(el => el.style.display = 'none');
    }
  </script>

  <!-- EmailJS — MÊME configuration que le formulaire de contact du portfolio -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>emailjs.init('a8mKuHS56bPD-ydT0');</script>

  <script src="js/audio.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/mobileControls.js"></script>
  <script src="js/player.js"></script>
  <script src="js/build-project.js"></script>
</body>
</html>
